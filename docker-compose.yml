# 운영 스타일: 멀티스테이지 이미지 빌드 + nginx 정적 서빙(핫 리로드 없음)
# 개발(핫 리로드)는 docker compose -f docker-compose.dev.yml up 사용
services: # 이 파일에서 기동할 컨테이너 묶음
  db: # PostgreSQL 서비스
    image: postgres:16-alpine # 공식 Postgres 16 경량 이미지
    container_name: react-auth-db # 고정 이름(로그·exec 시 식별 용이)
    restart: unless-stopped # 호스트 재부팅 후 자동 기동, 수동 중지 전까지 유지
    environment: # 컨테이너 내부 DB 초기 계정·DB명
      POSTGRES_USER: ${DB_USERNAME:-reactauth} # 슈퍼유저 겸 앱 DB 사용자
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reactauth} # 비밀번호(.env 또는 기본값)
      POSTGRES_DB: ${DB_NAME:-reactauth} # 초기 생성 데이터베이스 이름
    ports: # 호스트:컨테이너 포트 바인딩
      - '5432:5432' # 로컬 5432로 DB 접속
    volumes: # 데이터 영속 저장
      - postgres_data:/var/lib/postgresql/data # 볼륨에 PG 데이터 디렉터리
    healthcheck: # 준비 완료 후에만 depend 하는 서비스가 시작되도록
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'] # 접속 가능 여부
      interval: 5s # 검사 주기
      timeout: 5s # 한 번 검사 타임아웃
      retries: 5 # 연속 실패 허용 횟수

  backend: # NestJS API
    build: ./backend # backend/Dockerfile(릴리즈 멀티스테이지)로 이미지 빌드
    container_name: react-auth-api
    restart: unless-stopped
    ports:
      - '3000:3000' # 호스트에서 API 직접 호출
    environment: # Nest 런타임 설정
      NODE_ENV: production # 프로덕션 모드
      TYPEORM_SYNC: ${TYPEORM_SYNC:-true} # 엔티티→DB 스키마 자동 동기화(운영은 false 권장)
      DB_HOST: db # Compose 네트워크에서 db 서비스 호스트명
      DB_PORT: 5432 # 컨테이너 간 Postgres 포트
      DB_USERNAME: ${DB_USERNAME:-reactauth}
      DB_PASSWORD: ${DB_PASSWORD:-reactauth}
      DB_NAME: ${DB_NAME:-reactauth}
      PORT: 3000 # Nest 리스닝 포트
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-react_auth_jwt_access_dev_key_32chars_min!!} # 액세스 토큰 서명
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-react_auth_jwt_refresh_dev_key_32chars!!} # 리프레시 토큰 서명
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m} # 액세스 만료
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d} # 리프레시 만료
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080} # CORS·쿠키 허용 오리진
      UPLOAD_ROOT: /app/uploads # 업로드 파일 루트 경로
    volumes: # 업로드 파일 영속화
      - backend_uploads:/app/uploads # named volume으로 바인딩
    depends_on: # 시작 순서 제어
      db: # DB 먼저
        condition: service_healthy # healthcheck 통과 후 backend 기동
    healthcheck: # 프론트 depends_on 용 API 준비 신호
      test: # 컨테이너 내부에서 루트 URL HTTP 확인
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s # 초기 부팅 유예(의존 서비스 대기)

  frontend: # nginx + 빌드된 SPA
    build: ./frontend # frontend/Dockerfile(빌드+nginx)로 이미지 생성
    container_name: react-auth-web
    restart: unless-stopped
    ports:
      - '8080:80' # 브라우저는 localhost:8080으로 접속(nginx 80)
    depends_on: # API 준비 후 정적+프록시 서빙
      backend:
        condition: service_healthy

volumes: # 이름 붙은 볼륨 선언(데이터·업로드 유지)
  postgres_data: # DB 데이터 디렉터리
  backend_uploads: # 게시글 등 업로드 파일
